[project]
name = "robot-teaches-human"
version = "0.1.0"
description = "A simulated Unitree G1 teaches martial arts stances and corrects you limb by limb."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "mujoco>=3.2",
    "mediapipe>=0.10.14",
    "opencv-contrib-python>=4.9",  # mediapipe already depends on the contrib build; two cv2 builds clash
    "openai>=1.40",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "huggingface-hub>=0.24",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
rth = "rth.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "assets: needs downloaded robot model or clips (run scripts/fetch_assets.py)",
    "camera: needs a webcam",
    "nebius: calls the live Nebius API (needs NEBIUS_API_KEY)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
