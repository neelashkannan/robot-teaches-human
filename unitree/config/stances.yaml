# The stances the G1 teaches. `id` is used everywhere (recordings, recogniser, sensei).
# `description` is what the move picker embeds, so write it the way a visitor would ask.
# `pose` is owned by the robot module: where the G1's joint angles come from.
stances:
  - id: ready
    name: Ready stance
    description: Stand tall with feet together and arms relaxed by your sides. A calm, easy starting position.
    tags: [easy, warm-up, neutral, calm, start]
    difficulty: 1
    hold_s: 2.0
    pose:
      source: joints
      degrees: true
      joints:
        left_shoulder_roll_joint: 8.0
        right_shoulder_roll_joint: -8.0
        left_elbow_joint: 82.0
        right_elbow_joint: 82.0

